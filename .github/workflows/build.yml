name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test, package, and validate the plugin
        run: ./gradlew test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure --console=plain
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ideatabmanager-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
