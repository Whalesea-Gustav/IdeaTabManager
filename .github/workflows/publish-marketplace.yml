name: Publish to JetBrains Marketplace

on:
  workflow_run:
    workflows:
      - GitHub Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Git tag version without the v prefix, for example 0.2.5"
        required: true
        type: string
      channel:
        description: "Marketplace release channel"
        required: true
        default: default
        type: choice
        options:
          - default
          - eap

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.event.workflow_run.head_branch || format('v{0}', inputs.version) }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: jetbrains-marketplace

    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            TAG="$RELEASE_TAG"
            CHANNEL="default"
          else
            TAG="v$MANUAL_VERSION"
            CHANNEL="$MANUAL_CHANNEL"
          fi

          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use a version such as v0.2.5 or v0.3.0-eap.1."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG to Marketplace channel $CHANNEL"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Marketplace token
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "::error::Repository secret PUBLISH_TOKEN is not configured."
            exit 1
          fi

      - name: Verify and publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: >-
          ./gradlew
          test
          verifyPluginProjectConfiguration
          verifyPluginStructure
          publishPlugin
          -PpluginVersion=${{ steps.release.outputs.version }}
          -PpluginChannel=${{ steps.release.outputs.channel }}
          --console=plain
