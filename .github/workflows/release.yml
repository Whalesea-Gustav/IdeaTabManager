name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Validate and extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use a version such as v0.2.5 or v0.3.0-eap.1" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release
        run: >-
          ./gradlew
          test
          buildPlugin
          verifyPluginProjectConfiguration
          verifyPluginStructure
          -PpluginVersion=${{ steps.version.outputs.version }}
          --console=plain

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/distributions/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
              --verify-tag \
              --generate-notes \
              --title "Tab Groups ${{ steps.version.outputs.version }}"
          fi
